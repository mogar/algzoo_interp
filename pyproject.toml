[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "algzoo-interp"
version = "0.0.1"
description = "Mechanistic interpretability experiments on AlgZoo models"
requires-python = ">=3.10"
dependencies = ["alg-zoo", "torch>=2.4.1", "numpy>=1.24", "matplotlib>=3.6", "blobfile>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["algzoo_interp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["scripts: end-to-end smoke tests of scripts/ (slow; run with pytest -m scripts)"]
addopts = "-m 'not scripts'"
